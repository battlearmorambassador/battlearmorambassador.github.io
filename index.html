<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #000; --panel: #070707; --line: #1f1f1f; --fg: #ededed; --dim: #8a8a8a; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 "Inter", system-ui, sans-serif; }
  main { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
  .side { position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; padding: 48px 24px; color: var(--fg); text-decoration: none; text-align: center; transition: background .2s; }
  .side:hover { background: var(--panel); }
  .side h1 { margin: 0; font-weight: 300; font-size: clamp(26px, 4vw, 44px); letter-spacing: -.02em; }
  .side p { margin: 0; color: var(--dim); }
  .side + .side { border-left: 1px solid var(--line); }
  .cover { position: absolute; inset: 0; }
  .gh { position: relative; display: inline-flex; align-items: center; gap: 6px; color: var(--fg); text-decoration: none; border-bottom: 1px solid #2e2e2e; }
  .gh:hover { border-color: var(--fg); }
  @media (max-width: 700px) {
    main { grid-template-columns: 1fr; }
    .side + .side { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
